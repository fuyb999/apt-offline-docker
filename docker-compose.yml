services:
  downloader:
    build:
      context: .
      args:
        - CORE_IMAGE=${CORE_IMAGE}
    image: aura/apt-offline-gui-builder:${BUILDER_TAG:-latest}
    user: "0:0"
    volumes:
      - ./output:/output:rw
    environment:
      - CORE_IMAGE=${CORE_IMAGE}
      - OUTPUT_ROOT=/output
      - PINYIN_SOURCE_PACKAGE=${PINYIN_SOURCE_PACKAGE:-fcitx5-pinyin}
      - CC_SWITCH_VERSION=${CC_SWITCH_VERSION}
      - CC_SWITCH_DEB_URL=${CC_SWITCH_DEB_URL}
      - PKG_DOWNLOAD_LIST=${PKG_DOWNLOAD_LIST}
      - NODE_VERSION=${NODE_VERSION}
      - NVM_VERSION=${NVM_VERSION}
      - NODE_DEFAULT_ENV=${NODE_DEFAULT_ENV:-tools}
      - BUN_VERSION=${BUN_VERSION}
      - PNPM_VERSION=${PNPM_VERSION}
      - OPENCODE_VERSION=${OPENCODE_VERSION}
      - CODEX_VERSION=${CODEX_VERSION}
      - CLAUDE_CODE_VERSION=${CLAUDE_CODE_VERSION}
      - CLAUDE_CODE_ROUTER_VERSION=${CLAUDE_CODE_ROUTER_VERSION}
      - NVM_ARCHIVE_URL=${NVM_ARCHIVE_URL}
      - NODE_ARCHIVE_URL=${NODE_ARCHIVE_URL}
      - BUN_ARCHIVE_URL=${BUN_ARCHIVE_URL}
      - NVM_ARCHIVE_SHA256=${NVM_ARCHIVE_SHA256}
      - NODE_ARCHIVE_SHA256=${NODE_ARCHIVE_SHA256}
      - BUN_ARCHIVE_SHA256=${BUN_ARCHIVE_SHA256}
